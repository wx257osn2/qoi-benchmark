name: Build and deploy image

on:
  push:
    tags: [ "image**" ]

jobs:
  with_docker:
    strategy:
      matrix:
        image: [ubuntu-26.04, ubuntu-26.04-arm]
    runs-on: ${{ matrix.image }}
    env:
      APPTAINER_TMPDIR: ${{ github.workspace }}/.apptainer-tmp
      APPTAINER_CACHEDIR: ${{ github.workspace }}/.apptainer-cache
    steps:
    - name: stop update man-page
      run: |
        echo "set man-db/auto-update false" | sudo debconf-communicate
        sudo dpkg-reconfigure man-db
    - parallel:
      - uses: wx257osn2/setup-apptainer@v1.5.4
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: crazy-max/ghaction-github-runtime@v4
    - run: |
        mkdir -p ${APPTAINER_TMPDIR} ${APPTAINER_CACHEDIR}
    - name: build
      shell: bash
      run: |
        sudo apt update
        sudo apt install -y --no-install-recommends proot
        DOCKER_BUILD_EXTRA_OPTIONS="--cache-to type=gha,mode=max --cache-from type=gha --load" cxx_environment/build.bash
  standalone:
    strategy:
      matrix:
        include:
          - image: ubuntu-26.04
            arch: x86_64
          - image: ubuntu-26.04-arm
            arch: aarch64
    runs-on: ${{ matrix.image }}
    env:
      APPTAINER_TMPDIR: ${{ github.workspace }}/.apptainer-tmp
      APPTAINER_CACHEDIR: ${{ github.workspace }}/.apptainer-cache
    steps:
    - name: stop update man-page
      run: |
        echo "set man-db/auto-update false" | sudo debconf-communicate
        sudo dpkg-reconfigure man-db
    - parallel:
      - uses: wx257osn2/setup-apptainer@v1.5.4
      - uses: actions/checkout@v7
    - run: |
        mkdir -p ${APPTAINER_TMPDIR} ${APPTAINER_CACHEDIR}
    - name: build
      shell: bash
      run: cxx_environment/build.bash
    - uses: actions/upload-artifact@v7
      with:
        name: sif-${{ matrix.arch }}
        path: cxx_environment/cxx-${{ matrix.arch }}.sif
        retention-days: 1
  deploy:
    runs-on: ubuntu-slim
    needs: standalone
    permissions:
      contents: write
    steps:
    - parallel:
      - uses: actions/download-artifact@v8
        with:
          name: sif-x86_64
      - uses: actions/download-artifact@v8
        with:
          name: sif-aarch64
    - uses: softprops/action-gh-release@v3
      with:
        files: |
          cxx-x86_64.sif
          cxx-aarch64.sif
